<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X 영상 받기</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15202b">
<style>
  :root { --bg:#f5f5f7; --card:#fff; --text:#111; --sub:#666; --line:#ddd; --accent:#1d9bf0; --ok:#00ba7c; --bad:#f4212e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --card:#16181c; --text:#e7e9ea; --sub:#8b98a5; --line:#2f3336; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:22px; margin:0 0 16px; display:flex; align-items:baseline; justify-content:space-between; }
  .ver { font-size:12px; font-weight:500; color:var(--sub); border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  textarea { width:100%; min-height:72px; font-size:16px; padding:12px; border-radius:12px; border:1px solid var(--line); background:transparent; color:var(--text); resize:vertical; }
  button, .btn { display:block; width:100%; font-size:17px; font-weight:600; padding:14px; border:0; border-radius:12px; margin-top:10px; cursor:pointer; text-align:center; text-decoration:none; }
  .primary { background:var(--accent); color:#fff; }
  .ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .hint { font-size:13px; color:var(--sub); margin-top:10px; line-height:1.5; }
  #msg { margin-top:12px; font-size:15px; min-height:1em; line-height:1.5; }
  #msg.bad { color:var(--bad); }
  #msg.ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>X 영상 받기 <span class="ver">v25 · 드라이브로 바로</span></h1>
  <div class="card">
    <button class="primary" id="pasteBtn">📋 복사한 링크 붙여넣고 드라이브에 저장</button>
    <textarea id="input" placeholder="또는 여기에 X·인스타 링크를 붙여 넣기"></textarea>
    <button class="ghost" id="sendBtn">☁️ 드라이브에 저장</button>
    <div id="msg"></div>
    <div class="hint">링크를 보내면 <b>맥북이 받아서 구글 드라이브에 저장</b>해요. 휴대폰에는 받지 않아요.<br>
      X → 「X영상」 폴더, 인스타 → 「개인/인스타저장」 폴더<br>
      X·인스타 앱에서 「공유」 → 「X 영상 받기」를 눌러도 바로 저장돼요.</div>
    <a class="btn ghost" id="listBtn" href="#" hidden>📂 저장한 목록 보기 (인스타 저장 페이지)</a>
  </div>
</main>
<script>
// v23 (2026-11-26): 휴대폰 받기 없앰 → 링크를 맥북 저장 도구(인스타 저장, 구글 앱스 스크립트)로 넘겨 맥북이 드라이브에 저장
// 저장 도구 주소는 공개 코드에 적지 않고, 「인스타 저장」 페이지의 연결 버튼(#ig=…)을 한 번 열면 이 브라우저에 기억함
const $ = id => document.getElementById(id);
const EKEY = 'igsave_exec', PKEY = 'igsave_pending', QKEY = 'igsave_post';
const LINK_RE = /https?:\/\/(?:www\.|mobile\.)?(?:instagram|x|twitter|fixupx|fxtwitter|vxtwitter)\.com\/[^\s]+/i;

function setup(src) {
  const h = src || location.hash;
  const pm = /[#&]p=([^&\s]+)/.exec(h);
  if (pm) { try { const [u, k] = atob(decodeURIComponent(pm[1])).split('|'); if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) && k) localStorage.setItem(QKEY, JSON.stringify({ u, k })); } catch {} }
  const m = /[#&]ig=([^&\s]+)/.exec(h);
  if (!m) return;
  try {
    const url = atob(decodeURIComponent(m[1]));
    if (/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(url)) {
      localStorage.setItem(EKEY, url);
      say('✅ 이 휴대폰을 맥북 저장 도구에 연결했어요. 이제 링크를 보내면 드라이브에 저장돼요.', 'ok');
      $('listBtn').href = url; $('listBtn').hidden = false;
      const pend = localStorage.getItem(PKEY);
      if (pend) { localStorage.removeItem(PKEY); setTimeout(() => go(pend), 800); }
      return true;
    }
  } catch {}
  history.replaceState(null, '', location.pathname + location.search);
}
setup();
addEventListener('hashchange', () => { setup(); if (exec()) { $('listBtn').href = exec(); $('listBtn').hidden = false; } });

function exec() { try { return localStorage.getItem(EKEY) || ''; } catch { return ''; } }
function say(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }

function go(text) {
  if (/[#&]ig=/.test(text || '')) { if (!setup(text)) say('연결 링크가 잘못됐어요. 텔레그램 링크를 다시 복사해 주세요.', 'bad'); return; }
  const m = LINK_RE.exec(text || '');
  if (!m) { say('X·인스타 링크를 찾지 못했어요. 링크를 다시 복사해 주세요.', 'bad'); return; }
  let link = m[0].replace(/^(https?:\/\/)(?:fixupx|fxtwitter|vxtwitter)\.com/i, '$1x.com');
  const e = exec();
  if (!e) {
    try { localStorage.setItem(PKEY, link); } catch {}
    say('처음 한 번 연결이 필요해요. 텔레그램으로 받은 연결 링크를 길게 눌러 복사한 뒤, 위 파란 버튼을 누르세요. 연결되면 이 링크도 바로 저장돼요.', 'bad');
    return;
  }
  say('☁️ 맥북으로 보내는 중…');
  const q = post();
  if (!q) { location.href = e + (e.includes('?') ? '&' : '?') + 'share=' + encodeURIComponent(link); return; }
  // 화면 이동 없이 보내기 (로그인 필요 없는 받기 주소 + 열쇠)
  fetch(q.u, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ k: q.k, text: link }) })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) throw new Error(d.msg || '실패');
      $('input').value = '';
      say('✅ 보냈어요. 맥북이 받아 드라이브에 저장해요. (뒤로 가기를 누르면 X로 돌아가요)', 'ok');
      if (launchedByShare) setTimeout(() => window.close(), 1500);
    })
    .catch(() => { location.href = e + (e.includes('?') ? '&' : '?') + 'share=' + encodeURIComponent(link); });
}
function post() { try { return JSON.parse(localStorage.getItem(QKEY)); } catch { return null; } }
let launchedByShare = false;

$('pasteBtn').onclick = async () => {
  try { const t = await navigator.clipboard.readText(); $('input').value = t; go(t); }
  catch { say('붙여넣기 권한이 없어요. 아래 칸을 길게 눌러 직접 붙여 넣고 「드라이브에 저장」을 눌러 주세요.', 'bad'); }
};
$('sendBtn').onclick = () => go($('input').value);

if (exec()) { $('listBtn').href = exec(); $('listBtn').hidden = false; }

// 다른 앱 「공유」로 들어온 링크 → 바로 저장
const p = new URLSearchParams(location.search);
const shared = [p.get('url'), p.get('text'), p.get('title')].filter(Boolean).join(' ');
if (shared) { launchedByShare = true; $('input').value = shared; history.replaceState(null, '', location.pathname); go(shared); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
